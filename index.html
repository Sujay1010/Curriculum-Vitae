<title>Sujay Arjunan – Biomedical Engineer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#070B14;--panel:#0E1524;--line:#1E2B45;--text:#DCE6F5;--mute:#8A9AB8;--sig:#4FD1E8;--warm:#F2B35E;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.65 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Sora,"Segoe UI",system-ui,sans-serif;margin:0;line-height:1.15}
a{color:var(--sig);text-underline-offset:3px}
a:focus-visible,.btn:focus-visible{outline:2px solid var(--warm);outline-offset:3px}
.wrap{max-width:980px;margin:0 auto;padding:0 24px}
/* hero */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 80% at 85% 20%,rgba(79,209,232,.16),transparent 70%),linear-gradient(rgba(79,209,232,.06) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,rgba(79,209,232,.06) 1px,transparent 1px) 0 0/48px 48px;-webkit-mask-image:linear-gradient(to bottom,#000 60%,transparent);mask-image:linear-gradient(to bottom,#000 60%,transparent)}
.hero .wrap{position:relative;display:grid;grid-template-columns:1fr 250px;gap:40px;align-items:end;padding-top:72px;padding-bottom:56px}
.hero h1{font-size:clamp(2.6rem,7vw,4.6rem);font-weight:700;letter-spacing:-.02em}
.hero p{max-width:34em;color:var(--mute);font-size:1.1rem;margin:18px 0 26px}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-block;padding:10px 18px;border:1px solid var(--sig);border-radius:6px;color:var(--sig);text-decoration:none;font-weight:500}
.btn:hover{background:var(--sig);color:var(--bg)}
.photo{width:100%;aspect-ratio:4/5;border-radius:10px;border:1px solid var(--line);background:var(--panel) center top/cover no-repeat;display:grid;place-items:center;font:700 3rem Sora,sans-serif;color:var(--sig);box-shadow:0 0 0 6px rgba(79,209,232,.07)}
/* sections */
section{display:grid;grid-template-columns:200px 1fr;gap:32px;padding:44px 0;border-bottom:1px solid var(--line)}
section>h2{font-size:1.05rem;font-weight:600;color:var(--sig);letter-spacing:.01em}
.row{display:grid;grid-template-columns:150px 1fr;gap:20px;padding:0 0 26px}
.row:last-child{padding-bottom:0}
.when{color:var(--mute);font-size:.9rem;padding-top:3px}
.row h3{font-size:1.08rem;font-weight:600}
.sub{color:var(--mute);font-size:.95rem;margin-top:2px}
ul{margin:10px 0 0;padding-left:18px}
li{margin:4px 0;max-width:62ch}
li::marker{color:var(--sig)}
.hl{color:var(--warm);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:3px 10px;font-size:.88rem}
.grp{padding-bottom:22px}.grp:last-child{padding-bottom:0}
.grp h3{font-size:.95rem;color:var(--mute);font-weight:500;font-family:"IBM Plex Sans",sans-serif}
.paper{padding-bottom:16px;max-width:64ch}
.paper b{font-weight:500}
footer{padding:36px 0 48px;color:var(--mute);font-size:.9rem}
@media(max-width:760px){
.hero .wrap{grid-template-columns:1fr;padding-top:48px}
.photo{max-width:220px;order:-1}
section{grid-template-columns:1fr;gap:18px;padding:34px 0}
.row{grid-template-columns:1fr;gap:4px}
}
</style>
</head>

<div>

<p id="tag"></p>
<div class="btns" id="links"></div>
</div>
<div class="photo" id="photo" role="img"></div>
</div>
</header>
<main class="wrap" id="main"></main>
<footer class="wrap" id="foot"></footer>

const $ = s => document.querySelector(s);
const ul = a => "<ul>" + a.map(p => "<li>" + p + "</li>").join("") + "</ul>";
const sec = (t, h) => "<section><h2>" + t + "</h2><div>" + h + "</div></section>";

btns += DATA.links.map(l => "<a class='btn' href='" + l.url + "' target='_blank' rel='noopener'>" + l.label + "</a>").join("");

$("#links").innerHTML = btns;

let h = "";
h += sec("Education", DATA.education.map(e =>
  "<div class='row'><div class='when'>" + e.years + "</div><div><h3>" + e.title + "</h3><div class='sub'>" + e.where + (e.score ? ", " + e.score : "") + "</div></div></div>").join(""));
h += sec("Publications", DATA.papers.map(p => "<div class='paper'><b>" + p + "</b></div>").join("") + "<div class='sub'>" + DATA.papersNote + "</div>");
h += sec("Experience", DATA.experience.map(e =>
  "<div class='row'><div class='when'>" + e.when + "</div><div><h3>" + e.title + "</h3><div class='sub'>" + e.where + "</div>" + ul(e.points) + "</div></div>").join(""));
h += sec("Projects", DATA.projects.map(p =>
  "<div class='row'><div class='when'>" + p.when + "</div><div><h3>" + p.title + "</h3>" + ul(p.points) + "</div></div>").join(""));
h += sec("Skills", DATA.skills.map(s =>
  "<div class='grp'><h3>" + s.g + "</h3><div class='chips'>" + s.items.map(i => "<span class='chip'>" + i + "</span>").join("") + "</div></div>").join(""));
h += sec("Leadership", DATA.leadership.map(l =>
  "<div class='row'><div class='when'>" + l.when + "</div><div><h3>" + l.title + "</h3><div class='sub'>" + l.text + "</div></div></div>").join(""));
